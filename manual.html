<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CurtainCall 取扱説明書</title>
<meta name="description" content="CurtainCall（婚礼当日エンドロールのためのメディア取り込み自動化アプリ）の取扱説明書。お使いのパソコンを選んで、取扱説明書をお読みください。" />
<meta property="og:title" content="CurtainCall 取扱説明書" />
<meta property="og:description" content="お使いのパソコンを選んで、画面つきの簡単な取扱説明書をお読みください。" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /*
    取扱説明書の入口ページ。お使いのパソコン（Mac／Windows）を選んで各版へ進むだけの短いページ。
    デザイントークン・フォント・表紙・奥付は manual-mac.html と同じ。ライト固定、外部スクリプトなし。
    Windows 版の取扱説明書ができたら、準備中のボタンを manual-win.html へのリンク（btn-primary）に差し替える。
  */
  :root {
    color-scheme: light;
    /* 面 */
    --ground: #FAFAF7;
    --surface: #FFFFFF;
    --line: #E4E3DD;
    --line-soft: #EFEEE9;
    /* 文字 */
    --ink: #16161A;
    --ink-2: #5E5E57;
    /* 差し色（唯一） */
    --accent: #1F3FD1;
    --accent-deep: #142C9A;
    --accent-soft: #E6EBFB;
    /* 流動グラデーション（表紙のみ） */
    --aurora-base: #F7F6F3;
    --aurora-1: #A9CFDA;
    --aurora-2: #EEE2A8;
    --aurora-3: #D3BFE2;
    /* 書体 */
    --font: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* ライトテーマ1本に固定。閲覧側のテーマ設定に関わらず地色を明示する */
  html, :root[data-theme="light"], :root[data-theme="dark"] {
    background: var(--ground);
    color-scheme: light;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.9;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration-color: rgba(31,63,209,.35); text-underline-offset: 3px; }
  a:hover { color: var(--accent-deep); text-decoration-color: var(--accent-deep); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  ::selection { background: var(--accent-soft); color: var(--ink); }

  /* ---------- 表紙 ---------- */
  .cover {
    position: relative;
    isolation: isolate;
    padding: 72px 24px 44px;
    text-align: center;
    overflow: hidden;
    background: var(--aurora-base);
    border-bottom: 1px solid var(--line);
  }
  .aurora { position: absolute; inset: -12%; z-index: -1; filter: blur(64px); }
  .aurora span { position: absolute; width: 46%; height: 46%; border-radius: 50%; opacity: .6; }
  .aurora span:nth-child(1) { background: var(--aurora-1); top: 6%; left: 6%; animation: auroraA 30s ease-in-out infinite alternate; }
  .aurora span:nth-child(2) { background: var(--aurora-2); top: -6%; right: 4%; animation: auroraB 34s ease-in-out infinite alternate; }
  .aurora span:nth-child(3) { background: var(--aurora-3); bottom: -14%; left: 32%; animation: auroraC 26s ease-in-out infinite alternate; }
  @keyframes auroraA { from { transform: translate(0, 0); } to { transform: translate(7%, 9%); } }
  @keyframes auroraB { from { transform: translate(0, 0); } to { transform: translate(-8%, 6%); } }
  @keyframes auroraC { from { transform: translate(0, 0); } to { transform: translate(6%, -7%); } }
  @media (prefers-reduced-motion: reduce) {
    .aurora span { animation: none !important; }
  }
  .cover-inner { position: relative; max-width: 620px; margin: 0 auto; }
  .cover-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .2em;
    color: var(--accent);
    text-indent: .2em;
  }
  .cover h1 {
    font-size: clamp(40px, 8vw, 68px);
    font-weight: 900;
    line-height: 1.12;
    letter-spacing: -0.01em;
    margin-top: 16px;
    text-wrap: balance;
  }

  /* ---------- パソコンの選択 ---------- */
  .choose {
    flex: 1 0 auto;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 24px 96px;
    text-align: center;
  }
  .choose h2 {
    font-size: clamp(22px, 3vw, 28px);
    font-weight: 900;
    line-height: 1.45;
    text-wrap: balance;
  }
  /* 句の途中で折り返さない */
  .nobr { display: inline-block; }
  .choice-list {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 32px 24px;
    margin-top: 32px;
  }
  .choice { display: flex; flex-direction: column; align-items: stretch; gap: 10px; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 56px;
    padding: 0 28px;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    border-radius: 4px;
    transition: background-color 150ms linear, color 150ms linear;
  }
  .btn-primary { background: var(--accent); color: #FFFFFF; }
  .btn-primary:hover { background: var(--accent-deep); color: #FFFFFF; }
  /* 押せない状態は aria-disabled と見た目（灰色・禁止カーソル・hover 変化なし）の両方で示す（index.html と同じ作り） */
  .btn[aria-disabled="true"],
  .btn[aria-disabled="true"]:hover {
    background: var(--line);
    color: var(--ink-2);
    box-shadow: inset 0 0 0 1px rgba(22, 22, 26, .12);
    cursor: not-allowed;
  }
  .choice-note { font-size: 13.5px; line-height: 1.7; color: var(--ink-2); }

  /* ---------- 奥付 ---------- */
  .colophon {
    width: 100%;
    max-width: 1080px;
    margin: 0 auto;
    padding: 30px 24px 64px;
    border-top: 1px solid var(--line);
    color: var(--ink-2);
    font-size: 13px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 24px;
    justify-content: space-between;
  }
  .colophon .mark { font-weight: 900; letter-spacing: .02em; color: var(--ink); }
  /* リンク名の途中で折り返さない */
  .colophon a { white-space: nowrap; }

  @media (max-width: 560px) {
    .cover { padding: 56px 16px 36px; }
    .choose { padding: 40px 16px 72px; }
    .colophon { padding-left: 16px; padding-right: 16px; }
    /* 狭い幅では1列に積む */
    .choice-list { grid-template-columns: minmax(0, 1fr); gap: 28px; margin-top: 28px; }
  }
</style>
</head>
<body>

<header class="cover">
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="cover-inner">
    <div class="cover-eyebrow">取扱説明書</div>
    <h1>CurtainCall</h1>
  </div>
</header>

<main class="choose">
  <h2><span class="nobr">お使いのパソコンを</span><span class="nobr">選んでください</span></h2>
  <ul class="choice-list">
    <li class="choice">
      <a class="btn btn-primary" href="manual-mac.html" aria-describedby="note-mac">Mac版</a>
      <p class="choice-note" id="note-mac">Apple Silicon Mac（macOS 11 以降）</p>
    </li>
    <li class="choice">
      <a class="btn" role="link" aria-disabled="true" aria-describedby="note-win">Windows版</a>
      <p class="choice-note" id="note-win">Windows版は準備中です</p>
    </li>
  </ul>
</main>

<footer class="colophon">
  <span class="mark">CurtainCall</span>
  <span>取扱説明書</span>
  <span><a href="tokushoho.html">特定商取引法に基づく表記</a>　<a href="terms.html">利用規約</a>　<a href="privacy.html">プライバシーポリシー</a>　<a href="contact.html">お問い合わせ</a></span>
  <span>Zmotions 岡崎 聡</span>
</footer>

</body>
</html>
